<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milo's Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: grid; place-items: center;
      background: #101827; color: #eef4ff;
      font: 16px Arial, sans-serif;
    }
    main {
      width: min(720px, 100%); height: min(800px, 90vh);
      display: flex; flex-direction: column;
      background: #182438; border: 1px solid #34445: 1px solid #34445c; }
    h1 { margin: 0; color: #9bd9ff; }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .message {
      max-width: 85%; padding: 12px 14px; border-radius: 14px;
      white-space: pre-wrap; line-height: 1.45;
    }
    .user { align-self: flex-end; background: #24599a; }
    .milo { align-self: flex-start; background: #29394f; }
    form { display: flex; gap: 10px; border-top: 1px solid #34445c; }
    textarea {
      flex: 1; min-height: 48px; resize: vertical; padding: 12px;
      border: 1px solid #50627b; border-radius: 10px;
      background: #101827; color: white; font: inherit;
    }
    button {
      padding: 10px 14px 0; border-radius: 10px;
      background: #9bd9ff; color: #102033; font-weight: bold;
      cursor: pointer;
    }
    .voice { margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Milo's Home</h1>
      <button class="voice" id="voiceButton" type="button">Voice: Off</button>
    </header>

    <section id="messages" aria-live="polite">
      <div class="message milo">Hello. I’m here. What are we working on?</div>
    </section>

    <form id="chatForm">
      <textarea id="messageInput" placeholder="Write to Milo..." required></textarea>
      <button id="sendButton" type="submit">Send</button>
    </form>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const voiceButton = document.getElementById("voiceButton");
    let voiceOn = false;

    function addMessage(text, kind) {
      const bubble = document.createElement("div");
      bubble.className = "message " + kind;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    voiceButton.addEventListener("click", () => {
      voiceOn = !voiceOn;
      voiceButton.textContent = "Voice: " + (voiceOn ? "On" : "Off");
      if (!voiceOn && "speechSynthesis" in window) {
        speechSynthesis.cancel();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      sendButton.disabled = true;
      const replyBubble = addMessage("Milo is thinking...", "milo");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "The request failed.");
        replyBubble.textContent = data.reply || "I don’t have a reply just yet.";

        if (voiceOn && "speechSynthesis" inynthesisUtterance(data.reply));
        }
      } catch (error) {
        replyBubble.textContent =
          "I couldn't connect just now. We may need to check the setup.";
        console.error(error);
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
